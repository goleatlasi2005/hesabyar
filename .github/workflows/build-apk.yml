name: Build Hesabyar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o hesabyar_android_studio_project\(1\).zip
          ls -la

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android app
        run: |
          cd hesabyar_android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesabyar-APK
          path: hesabyar_android/app/build/outputs/apk/debug/*.apk
