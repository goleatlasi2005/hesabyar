name: Build Hesabyar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract Jalali project
        run: unzip -o hesabyar_android_studio_project_jalali.zip
      - name: Update app HTML
        run: cp index.html hesabyar_android/app/src/main/assets/index.html
              - name: Update Android Java
        run: cp MainActivity.java hesabyar_android/app/src/main/java/ir/hesabyar/app/MainActivity.java
      - name: Build APK
        run: |
          cd hesabyar_android
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hesabyar-Jalali-APK
          path: hesabyar_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
